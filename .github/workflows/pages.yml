name: Verify site build

# Pages for this repository is configured as "Deploy from a branch", so GitHub's
# own pages-build-deployment run publishes the committed index.html at the repo
# root. This workflow does not deploy — a second deployer would only race that
# one. It guards the thing branch deployment cannot: that the generated
# index.html still matches the source it was built from.
#
# If Settings -> Pages -> Source is ever switched to "GitHub Actions", this
# workflow needs a deploy job added (actions/configure-pages, then
# actions/upload-pages-artifact with `site`, then actions/deploy-pages).

on:
  push:
    branches:
      - main
      - claude/math-diagnostic-assessment-vjnu5r
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild the site from numeracy-probe.html
        run: node build.mjs

      - name: Check the committed index.html is not stale
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html no longer matches numeracy-probe.html. Run 'node build.mjs' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi
          echo "index.html is current."

      - name: Check the page parses and boots
        run: |
          node -e '
            const s = require("fs").readFileSync("index.html", "utf8");
            const must = [
              ["doctype", /^<!doctype html>/i],
              ["single title", /<title>Numeracy Diagnostic Probe<\/title>/],
              ["intake form", /id="intakeForm"/],
              ["report mount", /id="report"/],
              ["twelve-item plan", /const PLAN=\[/]
            ];
            let bad = 0;
            for (const [name, re] of must) {
              if (!re.test(s)) { console.error("missing:", name); bad++; }
            }
            const opens = (s.match(/<script\b/g) || []).length;
            const closes = (s.match(/<\/script>/g) || []).length;
            if (opens !== closes) { console.error(`unbalanced script tags: ${opens} open, ${closes} close`); bad++; }
            if (bad) process.exit(1);
            console.log("index.html looks well formed.");
          '
